# Settings for the weekly publication sync (scripts/update_publications.py).
# Edit this file to control what the pipeline adds to the site.

# Your ORCID iD. Works are matched by ORCID, so name variants
# ("Bolson", "Favero Bolson") are handled automatically.
orcid: "0000-0002-2375-2657"

# Surnames used to highlight your name in author lists on the site.
owner_names:
  - "Bolson"

# OpenAlex work types to include. Options include: article, review,
# book-chapter, book, report, preprint, dataset, dissertation.
include_types:
  - article
  - review
  - book-chapter
  - book

# Ignore anything published before this year.
min_year: 2015

# Every new publication gets a news post (0 = no age limit).
# Set a number of days (e.g. 120) to create news posts only for recent papers.
news_window_days: 0

# DOIs the pipeline should never add (e.g. conference abstracts, errata,
# items you have rejected in a previous pull request).
ignore_dois: []
